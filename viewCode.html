<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Code | CodeWithAk</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
</head>
<body>
  
  <header class="sticky-nav">
     <div class="website-name">
       <a href="index.html"><img src="Icons/codewithak-high-resolution-logo-transparent.png" alt="Logo"></a>
     </div>
     <a href="index.html" class="btn btn-view" style="width: 100px;">
       <i class="fa-solid fa-arrow-left"></i> Back
     </a>
  </header>

  <div class="container view-code-wrapper">
    <div class="sidebar" id="projectInfo">
      </div>

    <div class="editor-window">
      <div class="tab-bar">
        <div class="tab active" data-type="html"><i class="fa-brands fa-html5" style="color: #e34c26;"></i> index.html</div>
        <div class="tab" data-type="css"><i class="fa-brands fa-css3-alt" style="color: #264de4;"></i> style.css</div>
        <div class="tab" data-type="js"><i class="fa-brands fa-js" style="color: #f0db4f;"></i> main.js</div>
      </div>
      
      <div class="code-area">
        <pre><code id="codeBlock" class="language-html">Loading source code...</code></pre>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <script src="viewCodemain.js"></script>
</body>
</html>
